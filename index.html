<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalty Master</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game">
    <header class="topbar">
      <div>
        <h1>⚽ Penalty Master</h1>
        <p>Beat the goalkeeper and score!</p>
      </div>

      <div class="scoreboard">
        <div>
          <span>GOALS</span>
          <strong id="goals">0</strong>
        </div>
        <div>
          <span>SAVES</span>
          <strong id="saves">0</strong>
        </div>
        <div>
          <span>SHOTS</span>
          <strong id="shots">0</strong>
        </div>
      </div>
    </header>

    <section class="stadium">
      <div class="crowd"></div>
      <div class="stadium-lights"></div>

      <div class="field">
        <div class="field-line halfway"></div>
        <div class="penalty-box"></div>
        <div class="goal-box"></div>
        <div class="penalty-spot"></div>

        <div class="goal">
          <div class="goal-top"></div>
          <div class="net"></div>

          <div id="keeper" class="keeper">
            <div class="keeper-head"></div>
            <div class="keeper-body">
              <div class="keeper-number">1</div>
            </div>
            <div class="keeper-arm left-arm"></div>
            <div class="keeper-arm right-arm"></div>
            <div class="keeper-leg left-leg"></div>
            <div class="keeper-leg right-leg"></div>
          </div>
        </div>

        <div id="ball" class="ball">
          <div class="ball-pattern"></div>
        </div>

        <div id="aimLine" class="aim-line"></div>
        <div id="target" class="target">+</div>
      </div>
    </section>

    <section class="controls">
      <div class="power-section">
        <div class="control-title">
          <span>SHOT POWER</span>
          <strong id="powerText">50%</strong>
        </div>

        <input
          id="power"
          type="range"
          min="15"
          max="100"
          value="50"
        >
      </div>

      <div class="control-title">
        <span>AIM</span>
        <strong id="aimText">CENTER</strong>
      </div>

      <div class="aim-buttons">
        <button data-aim="left">LEFT</button>
        <button data-aim="center" class="active">CENTER</button>
        <button data-aim="right">RIGHT</button>
      </div>

      <button id="shootBtn" class="shoot-button">SHOOT ⚽</button>
      <button id="resetBtn" class="reset-button">RESET GAME</button>

      <p id="message" class="message">Choose your aim and power!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
